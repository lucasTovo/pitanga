services:
  postgres:
    image: postgres
    container_name: postgres-container
    environment:
      POSTGRES_PASSWORD: mysecretpassword
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - pitangaweb
    ports:
      - "5432:5432"
  keycloak:
    build:
      dockerfile: ./docker/keycloak.Dockerfile
      context: .
      args:
        PG_URL: jdbc:postgres://postgres:5432/kc_pitanga
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: changeme
    ports:
      - "8444:8443"
    networks:
      - pitangaweb
    depends_on:
      - postgres
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 2G
  school:
    build:
      dockerfile: ./docker/school.Dockerfile
      context: ./school
    environment:
      DATABASE_URL: postgres://postgres:mysecretpassword@postgres:5432/school_pitanga
    ports:
      - "4000:4000"
    networks:
      - pitangaweb
    depends_on:
      - postgres

networks:
  pitangaweb:
    driver: bridge

volumes:
  postgres-data:
